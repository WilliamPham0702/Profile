name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/enable-pages.yml"

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${{ github.repository }}/pages"
          DATA='{"source":{"branch":"main","path":"/"}}'
          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API" \
            -d "$DATA")
          if [ "$CODE" = "201" ]; then
            echo "GitHub Pages enabled."
            exit 0
          fi
          if [ "$CODE" = "409" ] || [ "$CODE" = "422" ]; then
            CODE2=$(curl -sS -o /tmp/pages-update.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
              -d "$DATA")
            if [ "$CODE2" = "204" ]; then
              echo "GitHub Pages configuration updated."
              exit 0
            fi
            cat /tmp/pages-update.json
            exit 1
          fi
          cat /tmp/pages.json
          exit 1