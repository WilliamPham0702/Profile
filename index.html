<style>
:root{--bg:#002B69;--text:#fff;--muted:rgba(255,255,255,.74);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 18px;color:var(--text);background:radial-gradient(circle at 20% 8%,rgba(255,255,255,.13),transparent 30%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:min(100%,420px);padding:28px 22px 24px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));box-shadow:0 24px 70px rgba(0,0,0,.24);text-align:center}
.avatar{width:154px;height:154px;border-radius:50%;object-fit:cover;object-position:center 24%;border:4px solid rgba(255,255,255,.92);box-shadow:0 14px 34px rgba(0,0,0,.22)}
.company{margin:18px 0 8px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(30px,8vw,40px);line-height:1.05;letter-spacing:-.035em}
.title{margin:9px 0 0;color:var(--muted);font-size:16px}
.tagline{margin:20px 0;padding:15px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:17px;font-weight:650}
.info{display:grid;gap:10px;margin:20px 0;text-align:left}
.row{padding:13px 14px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.07);color:#fff;text-decoration:none;display:block}
.label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.58);margin-bottom:3px}
.value{font-size:14px;font-weight:600;overflow-wrap:anywhere}
button{width:100%;min-height:56px;border:0;border-radius:17px;background:#fff;color:var(--bg);font:inherit;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.18)}
button:active{transform:scale(.985)}
@media(max-width:380px){.card{padding:24px 16px 20px}.avatar{width:138px;height:138px}}
</style>
